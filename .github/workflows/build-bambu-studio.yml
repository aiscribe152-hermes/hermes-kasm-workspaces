name: Build Bambu Studio Kasm Workspace

on:
  push:
    branches:
      - main
    paths:
      - bambu-studio/**
      - .github/workflows/build-bambu-studio.yml
  schedule:
    # Rebuild weekly to pick up Kasm 1.19 rolling base-image updates.
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-bambu-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Bambu Studio workspace image
        uses: docker/build-push-action@v6
        with:
          context: ./bambu-studio
          file: ./bambu-studio/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/aiscribe152-hermes/kasm-bambu-studio:1.19.0-rolling-weekly
            ghcr.io/aiscribe152-hermes/kasm-bambu-studio:1.19.0-rolling-weekly-bambu-2.8.2.61-r5
            ghcr.io/aiscribe152-hermes/kasm-bambu-studio:latest
          labels: |
            org.opencontainers.image.title=Kasm Bambu Studio Workspace
            org.opencontainers.image.description=Small Kasm workspace image for Bambu Studio 2.8.2.61 slicing and 3D printing workflows
            org.opencontainers.image.version=1.19.0-rolling-weekly
            org.opencontainers.image.source=https://github.com/aiscribe152-hermes/hermes-kasm-workspaces

      - name: Smoke test published Bambu Studio workspace image
        run: |
          set -euo pipefail
          docker pull ghcr.io/aiscribe152-hermes/kasm-bambu-studio:1.19.0-rolling-weekly-bambu-2.8.2.61-r5
          docker run -d --name bambu-studio-smoke \
            --shm-size=1g \
            -e VNC_PW=smoke-test-password \
            ghcr.io/aiscribe152-hermes/kasm-bambu-studio:1.19.0-rolling-weekly-bambu-2.8.2.61-r5
          cleanup() { docker inspect bambu-studio-smoke --format '{{json .State}}' || true; docker logs bambu-studio-smoke || true; docker rm -f bambu-studio-smoke || true; }
          trap cleanup EXIT
          for _ in $(seq 1 120); do
            if docker exec bambu-studio-smoke bash -lc 'pgrep -f /opt/bambu-studio/squashfs-root/bin/bambu-studio >/dev/null 2>&1'; then
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx bambu-studio-smoke; then
              echo 'Bambu Studio smoke container exited before the app started' >&2
              exit 1
            fi
            sleep 1
          done
          docker exec bambu-studio-smoke bash -lc 'test "$(id -u)" -eq 0; test "${SSL_CERT_FILE}" = /etc/ssl/certs/ca-certificates.crt; test -x /usr/bin/google-chrome-stable; test -x /usr/local/bin/default-browser; grep -q "x-scheme-handler/https=default-browser.desktop" /home/kasm-user/.config/mimeapps.list; /usr/bin/google-chrome-stable --version; x-www-browser --version || true; /usr/local/bin/bambu-studio --version || true; pgrep -af bambu-studio; test -s /tmp/bambu-studio-startup.log || true; cat /tmp/bambu-studio-startup.log || true'
