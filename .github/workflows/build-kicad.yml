name: Build KiCad Kasm Workspace

on:
  push:
    branches:
      - main
    paths:
      - kicad/**
      - .github/workflows/build-kicad.yml
  schedule:
    # Rebuild weekly to pick up Kasm 1.19 rolling base-image updates.
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-kicad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push KiCad 10 workspace image
        uses: docker/build-push-action@v6
        with:
          context: ./kicad
          file: ./kicad/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/aiscribe152-hermes/kasm-kicad:1.19.0-rolling-weekly
            ghcr.io/aiscribe152-hermes/kasm-kicad:latest
          labels: |
            org.opencontainers.image.title=Kasm KiCad Workspace
            org.opencontainers.image.description=Small Kasm workspace image for KiCad 10 PCB design and electronics CAD
            org.opencontainers.image.version=1.19.0-rolling-weekly
            org.opencontainers.image.source=https://github.com/aiscribe152-hermes/hermes-kasm-workspaces

      - name: Smoke test published KiCad workspace image
        run: |
          set -euo pipefail
          docker pull ghcr.io/aiscribe152-hermes/kasm-kicad:1.19.0-rolling-weekly
          docker run -d --name kicad-smoke \
            --shm-size=512m \
            -e VNC_PW=smoke-test-password \
            ghcr.io/aiscribe152-hermes/kasm-kicad:1.19.0-rolling-weekly
          cleanup() { docker inspect kicad-smoke --format '{{json .State}}' || true; docker logs kicad-smoke || true; docker rm -f kicad-smoke || true; }
          trap cleanup EXIT
          for _ in $(seq 1 90); do
            if docker exec kicad-smoke bash -lc 'pgrep -x kicad >/dev/null 2>&1'; then
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx kicad-smoke; then
              echo 'KiCad smoke container exited before the app started' >&2
              exit 1
            fi
            sleep 1
          done
          docker exec kicad-smoke bash -lc 'kicad-cli version; dpkg-query -W kicad kicad-footprints kicad-libraries kicad-symbols kicad-templates; pgrep -a kicad; test -s /tmp/kicad-startup.log || true; cat /tmp/kicad-startup.log || true'
